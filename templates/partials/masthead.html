<div class="masthead">
  <div class="ticker">
    <div class="ticker__track">
      <span>{{ ticker_text }}</span>
      <span>{{ ticker_text }}</span>
      <span>{{ ticker_text }}</span>
    </div>
  </div>
  <div class="masthead__inner">
    <p class="masthead__mark">
      <a href="{{ asset_prefix }}index.html" class="masthead__lockup">
        <img src="{{ asset_prefix }}assets/logo-mark.svg" alt="" class="masthead__logo" width="40" height="40">
        Global Signal
      </a>
    </p>
    <p class="masthead__tagline">Tech developments from around the world, by dateline — checked automatically, every day.</p>
  </div>
</div>
{% if countries %}
<nav class="country-nav" aria-label="Countries covered this week">
  {% for c in countries %}
  <a href="#{{ c.anchor }}">{{ c.name }}<span class="count">{{ c.count }}</span></a>
  {% endfor %}
</nav>
{% endif %}

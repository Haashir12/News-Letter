{# Email HTML must use inline styles and simple table/div layout - most email
   clients (Outlook especially) ignore <style> blocks and external CSS. This
   is intentionally simpler than the website but keeps the same ink/gold
   identity so it's recognizable as the same publication. #}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Signal — {{ date_label }}</title>
</head>
<body style="margin:0; padding:0; background:#eeefea; font-family: Georgia, 'Times New Roman', serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eeefea;">
    <tr>
      <td align="center" style="padding: 24px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background:#eeefea;">

          <!-- Masthead -->
          <tr>
            <td style="background:#14181f; padding: 28px 28px 22px; border-radius: 4px 4px 0 0;">
              <div style="font-family: Georgia, 'Times New Roman', serif; font-weight:bold; font-size: 28px; color:#f2efe6; letter-spacing:-0.5px;">
                &#128225; Global Signal
              </div>
              <div style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; color:#c9cad2; margin-top:8px;">
                Today's tech developments, by dateline — {{ date_label }}
              </div>
            </td>
          </tr>

          <!-- Stories -->
          <tr>
            <td style="background:#ffffff; padding: 8px 28px 4px;">
              {% for c in countries %}
              <div style="margin: 26px 0 6px; padding-top: 18px; {% if not loop.first %}border-top: 1px solid #e2e3db;{% endif %}">
                <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#c6902e; margin-right:8px;"></span>
                <span style="font-family: Arial, Helvetica, sans-serif; font-weight:bold; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:#14181f;">{{ c.name }}</span>
              </div>
              {% for s in c.stories %}
              <div style="margin: 0 0 26px;">
                <div style="font-family: Georgia, 'Times New Roman', serif; font-weight:bold; font-size: 19px; line-height:1.3; color:#14181f; margin-bottom:8px;">
                  {{ s.headline }}
                </div>
                <div style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height:1.55; color:#2a303c; margin-bottom:8px;">
                  {{ s.summary }}
                </div>
                <div style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; color:#6b7280;">
                  Source: <a href="{{ s.source_url }}" style="color:#3e7c74;">{{ s.source }}</a>
                </div>
              </div>
              {% endfor %}
              {% endfor %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#ffffff; padding: 10px 28px 28px; border-radius: 0 0 4px 4px;">
              <div style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; color:#8a8f98; border-top:1px solid #e2e3db; padding-top:16px;">
                You're receiving this because you're subscribed to Global Signal.
                Read every past issue anytime at
                <a href="{{ site_url }}" style="color:#8a8f98;">{{ site_url_display }}</a>.
                To cancel your subscription, manage it from your Stripe receipt email,
                or reply to this email and we'll remove you.
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>

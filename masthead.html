<div class="masthead">
  <div class="ticker">
    <div class="ticker__track">
      <span>{{ ticker_text }}</span>
      <span>{{ ticker_text }}</span>
      <span>{{ ticker_text }}</span>
    </div>
  </div>
  <div class="masthead__inner">
    <p class="masthead__mark"><a href="{{ asset_prefix }}index.html" style="color:inherit; text-decoration:none;">Global Signal</a></p>
    <p class="masthead__tagline">The week's tech developments, by dateline — refreshed automatically, every Monday.</p>
  </div>
</div>
{% if countries %}
<nav class="country-nav" aria-label="Countries covered this week">
  {% for c in countries %}
  <a href="#{{ c.anchor }}">{{ c.name }}<span class="count">{{ c.count }}</span></a>
  {% endfor %}
</nav>
{% endif %}

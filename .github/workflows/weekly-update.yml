name: Daily Tech Newsletter Update

on:
  schedule:
    # Every day at 06:00 UTC. GitHub may delay scheduled runs by up to
    # ~30 minutes during busy periods — that's normal, not a bug.
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the new data/site files

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # safety net: kill the job if anything ever hangs, instead of burning hours
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate today's newsletter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_newsletter.py --backfill-days 10

      - name: Commit and push updated data + site
        run: |
          git config user.name "global-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "Nothing changed, skipping commit" || git commit -m "Daily update: $(date -u +'%Y-%m-%d')"
          git push
